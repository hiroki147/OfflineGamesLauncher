name: OfflineGames
options:
  bundleIdPrefix: com.example
targets:
  OfflineGames:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: OfflineGames
        excludes:
          - "Info.plist"
    settings:
      base:
        INFOPLIST_FILE: OfflineGames/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        PRODUCT_BUNDLE_IDENTIFIER: com.example.offlinegames
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
