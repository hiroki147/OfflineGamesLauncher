name: Build IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ios/**"

jobs:
  build:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate
        working-directory: ios

      - name: Build (unsigned)
        run: |
          xcodebuild \
            -project OfflineGames.xcodeproj \
            -scheme OfflineGames \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build
        working-directory: ios

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r "ios/build/Build/Products/Release-iphoneos/OfflineGames.app" Payload/
          zip -r OfflineGames.ipa Payload

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: OfflineGames-ipa
          path: OfflineGames.ipa
